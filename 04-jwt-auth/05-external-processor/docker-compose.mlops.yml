services:
  envoy:
    image: envoyproxy/envoy:v1.30-latest
    container_name: envoy-llm-mlops
    ports:
      - "8084:8084"
      - "9901:9901"
    volumes:
      - ./envoy-observability.yaml:/etc/envoy/envoy.yaml:ro
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    networks:
      - llm-mesh
      - ollama-net
    depends_on:
      - prometheus-mlops

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: phoenix-mlops
    ports:
      - "6006:6006"
      - "4317:4317"
      - "4318:4318"
    environment:
      - PHOENIX_WORKING_DIR=/tmp
      - PHOENIX_ENABLE_AUTH=false
    volumes:
      - phoenix-data:/tmp
    networks:
      - llm-mesh

  prometheus-mlops:
    image: prom/prometheus:latest
    container_name: prometheus-mlops
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/envoy-rules.yml:/etc/prometheus/envoy-rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - llm-mesh

  grafana-mlops:
    image: grafana/grafana:latest
    container_name: grafana-mlops
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - llm-mesh
    depends_on:
      - prometheus-mlops
      - phoenix

  keda-metrics:
    image: ghcr.io/kedacore/keda-metrics-apiserver:2.12.0
    container_name: keda-metrics-mlops
    ports:
      - "9022:9022"
    environment:
      - KEDA_PROMETHEUS_SERVER_ADDRESS=http://prometheus-mlops:9090
    networks:
      - llm-mesh
    depends_on:
      - prometheus-mlops

networks:
  llm-mesh:
    driver: bridge
  ollama-net:
    external: true
    name: 01-envoy-basico_default

volumes:
  phoenix-data:
  prometheus-data:
  grafana-data:
