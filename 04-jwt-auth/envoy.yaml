static_resources:
  listeners:
    - name: listener_llm
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http

                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format: "[%START_TIME%] %REQ(:METHOD)% %REQ(:PATH)% user:%REQ(x-jwt-sub)% tier:%REQ(x-jwt-tier)% status:%RESPONSE_CODE%\n"

                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: llm_backend
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/v1/chat/completions"
                          route:
                            cluster: ollama_cluster
                            timeout: 60s

                        - match:
                            path: "/health"
                          direct_response:
                            status: 200
                            body:
                              inline_string: '{"status":"ok","auth":"jwt-required"}'

                http_filters:
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        llm_provider:
                          issuer: "llm-mesh-gateway"
                          audiences:
                            - "llm-api"
                          local_jwks:
                            filename: /etc/envoy/jwks.json
                          forward: true
                          forward_payload_header: "x-jwt-payload"
                          claim_to_headers:
                            - header_name: "x-jwt-sub"
                              claim_name: "sub"
                            - header_name: "x-jwt-tier"
                              claim_name: "tier"

                      rules:
                        - match:
                            prefix: /v1/chat/completions
                          requires:
                            provider_name: llm_provider

                        - match:
                            path: /health

                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: http_local_rate_limiter
                      token_bucket:
                        max_tokens: 1000
                        tokens_per_fill: 1000
                        fill_interval: 60s
                      filter_enabled:
                        runtime_key: local_rate_limit_enabled
                        default_value:
                          numerator: 100
                          denominator: HUNDRED
                      filter_enforced:
                        runtime_key: local_rate_limit_enforced
                        default_value:
                          numerator: 100
                          denominator: HUNDRED
                      descriptors:
                        - entries:
                            - key: "tier"
                              value: "free"
                          token_bucket:
                            max_tokens: 10
                            tokens_per_fill: 10
                            fill_interval: 60s
                        - entries:
                            - key: "tier"
                              value: "pro"
                          token_bucket:
                            max_tokens: 100
                            tokens_per_fill: 100
                            fill_interval: 60s
                        - entries:
                            - key: "tier"
                              value: "enterprise"
                          token_bucket:
                            max_tokens: 1000
                            tokens_per_fill: 1000
                            fill_interval: 60s

                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: ollama_cluster
      connect_timeout: 3s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN

      load_assignment:
        cluster_name: ollama_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: host.docker.internal
                      port_value: 11434

      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 100
            max_pending_requests: 100
            max_requests: 100
            max_retries: 2

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
  access_log:
    - name: envoy.access_loggers.stdout
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
