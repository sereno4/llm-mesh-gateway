static_resources:
  listeners:
    - name: listener_llm
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format: "[%START_TIME%] %REQ(:METHOD)% %REQ(:PATH)% -> cluster:%UPSTREAM_CLUSTER% status:%RESPONSE_CODE% duration:%DURATION%ms\n"
                
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: llm_backend
                      domains: ["*"]
                      routes:
                        # CANARY: Header x-canary:true -> V2
                        - match:
                            prefix: "/v1/chat/completions"
                            headers:
                              - name: "x-canary"
                                exact_match: "true"
                          route:
                            cluster: ollama_v2
                            timeout: 60s
                        
                        # PADRÃO: Sem header -> V1
                        - match:
                            prefix: "/v1/chat/completions"
                          route:
                            cluster: ollama_v1
                            timeout: 60s
                        
                        # SHADOW: /v1/shadow/ -> V1 + mirror V2
                        - match:
                            prefix: "/v1/shadow/chat/completions"
                          route:
                            cluster: ollama_v1
                            timeout: 60s
                            request_mirror_policies:
                              - cluster: ollama_v2
                                runtime_fraction:
                                  default_value:
                                    numerator: 100
                                    denominator: HUNDRED
                        
                        - match:
                            path: "/health"
                          direct_response:
                            status: 200
                            body:
                              inline_string: '{"status":"ok","mode":"canary+shadow"}'
                        
                        - match:
                            path: "/config"
                          direct_response:
                            status: 200
                            body:
                              inline_string: '{"canary":{"v1_weight":90,"v2_weight":10,"header_override":"x-canary:true"},"shadow":{"mirror_percent":100},"clusters":["ollama_v1","ollama_v2"]}'
                
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      inline_code: |
                        function envoy_on_request(request_handle)
                          local path = request_handle:headers():get(":path")
                          
                          -- Se for shadow, reescreve path para /v1/chat/completions
                          if string.find(path, "/v1/shadow/") then
                            request_handle:headers():replace(":path", "/v1/chat/completions")
                            request_handle:logInfo("[SHADOW] Rewrote path: " .. path .. " -> /v1/chat/completions")
                          end
                          
                          local target = "default"
                          if string.find(path, "/shadow/") then
                            target = "shadow"
                          elseif request_handle:headers():get("x-canary") == "true" then
                            target = "canary-v2"
                          end
                          
                          request_handle:logInfo("[CANARY] Request: " .. path .. " target: " .. target)
                        end
                        
                        function envoy_on_response(response_handle)
                          local up = response_handle:headers():get("x-envoy-upstream-cluster") or "unknown"
                          response_handle:headers():add("x-served-by", up)
                        end
                  
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: ollama_v1
      connect_timeout: 3s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      
      health_checks:
        - timeout: 2s
          interval: 5s
          unhealthy_threshold: 2
          healthy_threshold: 1
          http_health_check:
            path: "/api/tags"
      
      outlier_detection:
        consecutive_5xx: 3
        interval: 10s
        base_ejection_time: 30s
      
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 100
            max_pending_requests: 100
            max_requests: 100
            max_retries: 2
      
      load_assignment:
        cluster_name: ollama_v1
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ollama-v1
                      port_value: 11434

    - name: ollama_v2
      connect_timeout: 3s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      
      health_checks:
        - timeout: 2s
          interval: 5s
          unhealthy_threshold: 2
          healthy_threshold: 1
          http_health_check:
            path: "/api/tags"
      
      outlier_detection:
        consecutive_5xx: 3
        interval: 10s
        base_ejection_time: 30s
      
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 50
            max_pending_requests: 50
            max_requests: 50
            max_retries: 1
      
      load_assignment:
        cluster_name: ollama_v2
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ollama-v2
                      port_value: 11434

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
  access_log:
    - name: envoy.access_loggers.stdout
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
