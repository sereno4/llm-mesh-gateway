static_resources:
  listeners:
    - name: listener_llm
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format: "[%START_TIME%] %REQ(:METHOD)% %REQ(:PATH)% -> cluster:%UPSTREAM_CLUSTER% status:%RESPONSE_CODE% duration:%DURATION%ms\n"
                
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: llm_backend
                      domains: ["*"]
                      routes:
                        # ROTA 1: Groq (com header x-target-cluster: groq)
                        - match:
                            prefix: "/v1/chat/completions"
                            headers:
                              - name: "x-target-cluster"
                                exact_match: "groq"
                          route:
                            cluster: groq_cluster
                            timeout: 30s
                        
                        # ROTA 2: Ollama (padrão)
                        - match:
                            prefix: "/v1/chat/completions"
                          route:
                            cluster: ollama_cluster
                            timeout: 60s
                            retry_policy:
                              retry_on: "gateway-error,connect-failure,refused-stream"
                              num_retries: 1
                              per_try_timeout: 10s
                        
                        - match:
                            prefix: "/api/tags"
                          route:
                            cluster: ollama_cluster
                            timeout: 5s
                        
                        - match:
                            path: "/health"
                          direct_response:
                            status: 200
                            body:
                              inline_string: '{"status":"ok","gateway":"envoy-fallback-v2","mode":"header-routing"}'
                
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      inline_code: |
                        function envoy_on_request(request_handle)
                          local path = request_handle:headers():get(":path")
                          local target = request_handle:headers():get("x-target-cluster") or "default"
                          
                          -- SÓ reescreve se for Groq
                          if target == "groq" then
                            request_handle:headers():replace(":path", "/openai/v1/chat/completions")
                            request_handle:logInfo("[GATEWAY] Rewrote path for Groq")
                          end
                          
                          request_handle:logInfo("[FALLBACK] Request: " .. path .. " target: " .. target)
                        end
                        
                        function envoy_on_response(response_handle)
                          local up = response_handle:headers():get("x-envoy-upstream-cluster") or "unknown"
                          response_handle:headers():add("x-served-by", up)
                        end
                  
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: ollama_cluster
      connect_timeout: 3s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      
      health_checks:
        - timeout: 2s
          interval: 5s
          unhealthy_threshold: 2
          healthy_threshold: 1
          http_health_check:
            path: "/api/tags"
      
      load_assignment:
        cluster_name: ollama_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ollama-local
                      port_value: 11434
      
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 100
            max_pending_requests: 10
            max_requests: 50
            max_retries: 2

    - name: groq_cluster
      connect_timeout: 5s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: api.groq.com
      
      load_assignment:
        cluster_name: groq_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: api.groq.com
                      port_value: 443
      
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
  access_log:
    - name: envoy.access_loggers.stdout
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
